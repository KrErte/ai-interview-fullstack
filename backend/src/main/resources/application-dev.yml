spring:
  datasource:
    url: jdbc:h2:file:./data/aiinterview-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ee.kerrete.ainterview.config.H2FriendlyPostgreSQLDialect

  liquibase:
    # FP-18: run demo seed changesets (context "demo") plus all context-free changesets.
    contexts: demo
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false
    clear-checksums: false

  h2:
    console:
      # FP-30: the H2 console is only enabled by the local profile (application-local.yml)
      enabled: false

# FP-60: dev-only entitlement (ignored unless the local/dev profile is active and prod is not)
billing:
  dev-entitled-emails: ${BILLING_DEV_ENTITLED_EMAILS:}
  dev-entitled-roles: ADMIN
