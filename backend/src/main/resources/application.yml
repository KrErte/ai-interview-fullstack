server:
  port: 8080

spring:
  profiles:
    active: local

  h2:
    console:
      # FP-30: off by default (and in dev/prod); only application-local.yml enables it
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: ee.kerrete.ainterview.config.H2FriendlyPostgreSQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    liquibase: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

openai:
  base-url: https://api.openai.com/v1
  api-key: ${OPENAI_API_KEY:dummy-openai-key}
  model: gpt-4.1-mini

management:
  endpoints:
    web:
      exposure:
        # FP-30: only health is exposed over HTTP (and it is the only public one, see SecurityConfig)
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
