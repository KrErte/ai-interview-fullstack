server:
  port: 8080

spring:
  profiles:
    active: local

  h2:
    console:
      # FP-30: off by default (and in dev/prod); only application-local.yml enables it
      enabled: false
  liquibase:
    # FP-18: safe default; demo seed changesets (context "demo") only run when a profile opts in.
    contexts: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: ee.kerrete.ainterview.config.H2FriendlyPostgreSQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    liquibase: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  # Public URL of the frontend: job pages, team report links and (FP-61) the Stripe Checkout success/cancel urls.
  # Env APP_PUBLIC_BASE_URL; falls back to FRONTEND_BASE_URL (older deployments set only that).
  public-base-url: ${APP_PUBLIC_BASE_URL:${FRONTEND_BASE_URL:http://localhost:4200}}
  jwt:
    # FP-28: JWT signing key. Unset outside prod -> random key per run (logged as such, key never logged).
    secret: ${JWT_SECRET:}
  llm:
    # Public assess (personalize) and the legacy OpenAI client share this cap.
    per-client-per-hour: 8
    global-per-hour: 60

billing:
  # FP-60: false = no paywall (roadmap free for logged-in users, /assess unchanged). true needs Stripe (FP-61/62).
  enabled: ${BILLING_ENABLED:false}
  # FP-61 checkout charges this Stripe Price (required in prod); empty = price_data fallback below (local/dev)
  stripe-price-id: ${STRIPE_PRICE_ID:}
  # FP-66: price text on public teasers only (keep in sync with the Stripe Price)
  display-price: ${BILLING_DISPLAY_PRICE:€19}
  # FP-61: only used as price_data while STRIPE_PRICE_ID is empty (local/dev), and as the expected amount on the
  # pending purchase until Stripe reports the charged amount
  fallback-amount-cents: ${BILLING_FALLBACK_AMOUNT_CENTS:1900}
  currency: ${BILLING_CURRENCY:eur}
  stripe:
    # test-mode key (sk_test_...) outside production; never commit a key
    secret-key: ${STRIPE_SECRET_KEY:}
    # FP-62: signing secret of the webhook endpoint (whsec_...); empty = every webhook is rejected with 400
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:20000}

openai:
  base-url: https://api.openai.com/v1
  # FP-20: empty = no-key mode (no OpenAI calls; AI-only endpoints answer 503 ai_unavailable)
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4.1-mini

management:
  endpoints:
    web:
      exposure:
        # FP-30: only health is exposed over HTTP (and it is the only public one, see SecurityConfig)
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
