version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      # FP-28: no default; set DB_PASSWORD in .env (same variable is passed to the backend below).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ai
      DB_USER: ai
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
      # FP-28: required in prod; the backend refuses to start if it is missing, short or a placeholder.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
      FRONTEND_BASE_URL: https://YOUR_DOMAIN
      # Optional startup seeding (FP-19, see backend/src/main/resources/application-prod.yml).
      # Values come from the gitignored .env next to this file (template: .env.example).
      # A user is created only when both its email and password are set; passwords are never logged.
      # Unset/missing .env -> empty values -> nothing is seeded.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: always

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  certbot-www:

